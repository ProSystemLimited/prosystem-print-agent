name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Pinned, not windows-latest. @thesusheer/electron-printer ships no
    # prebuild-install in its dependency tree, so its install script always
    # falls through to `node-gyp rebuild` and needs a C++ toolchain. The
    # windows-latest image moved to Visual Studio 18, which the node-gyp 10.x
    # bundled with Node 20 cannot detect ("unknown version undefined"), so the
    # install step fails. windows-2022 carries the VS 2022 toolchain that built
    # every release up to 1.0.15.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe